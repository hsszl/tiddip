<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tiddip · 插画一览</title>
<style>
  * { box-sizing: border-box; }
  body { max-width: 1000px; margin: 32px auto; padding: 0 24px; background: #e9e3d7; color: #414a3c; font: 13px system-ui, sans-serif; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 28px; }
  h1 { font: 600 26px Georgia, serif; margin: 0; }
  a { color: inherit; font-size: 12px; }
  h2 { font-size: 12px; font-weight: 500; color: #81765f; margin: 24px 0 12px; }
  section { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
  figure { margin: 0; padding: 5px; background: #faf5e9; border: 1px solid #c6b79c; border-radius: 6px; box-shadow: 0 2px #cdbfa5; }
  img { width: 100%; display: block; border-radius: 3px; }
  figcaption { padding: 9px 4px 5px; font-size: 12px; }
  .gear { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .items { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  @media (max-width: 600px) { section, .gear, .items { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
</style>
<header><h1>tiddip</h1><a href="/gaogame/">返回游戏 ↗</a></header>
<h2>地图</h2>
<section aria-label="地图插画">
  <figure><img src="assets/terrain/ground.svg" alt="弯曲小路、石头和草丛"><figcaption>空地</figcaption></figure>
  <figure><img src="assets/terrain/mine.svg" alt="地雷和红色警告旗"><figcaption>地雷</figcaption></figure>
  <figure><img src="assets/terrain/toilet.svg" alt="带月牙门的绿色小木屋"><figcaption>厕所</figcaption></figure>
  <figure><img src="assets/terrain/supply.svg" alt="装着卡牌的木箱"><figcaption>补给</figcaption></figure>
  <figure><img src="assets/terrain/clinic.svg" alt="带急救标记的医疗帐篷"><figcaption>医疗站</figcaption></figure>
  <figure><img src="assets/terrain/tower.svg" alt="有梯子和小旗的木制瞭望塔"><figcaption>瞭望塔</figcaption></figure>
  <figure><img src="assets/terrain/brambles.svg" alt="带尖刺的纠缠藤蔓"><figcaption>荆棘地</figcaption></figure>
  <figure><img src="assets/terrain/camp.svg" alt="帐篷、盾牌与篝火"><figcaption>营地</figcaption></figure>
  <figure><img src="assets/terrain/ruins.svg" alt="断裂石拱门与两张卡牌"><figcaption>遗迹</figcaption></figure>
  <figure><img src="assets/terrain/armory.svg" alt="挂着武器的绿色棚屋"><figcaption>军械库</figcaption></figure>
</section>
<h2>武器</h2>
<section class="gear" aria-label="武器插画">
  <figure><img src="assets/weapons/sniper.svg" alt="长枪管、瞄准镜和支架"><figcaption>狙击枪</figcaption></figure>
  <figure><img src="assets/weapons/rifle.svg" alt="木托步枪"><figcaption>步枪</figcaption></figure>
  <figure><img src="assets/weapons/pistol.svg" alt="短枪管、棕色握柄"><figcaption>手枪</figcaption></figure>
  <figure><img src="assets/weapons/bow.svg" alt="木制长弓和羽箭"><figcaption>长弓</figcaption></figure>
  <figure><img src="assets/weapons/boomerang.svg" alt="带绿色花纹的回旋镖"><figcaption>回旋镖</figcaption></figure>
  <figure><img src="assets/weapons/dagger.svg" alt="缠绳握柄的银色匕首"><figcaption>匕首</figcaption></figure>
  <figure><img src="assets/weapons/axe.svg" alt="木柄双刃战斧"><figcaption>战斧</figcaption></figure>
  <figure><img src="assets/weapons/crossbow.svg" alt="带弓弦和弩箭的十字弩"><figcaption>十字弩</figcaption></figure>
  <figure><img src="assets/weapons/mortar.svg" alt="带底座和支架的迫击炮"><figcaption>迫击炮</figcaption></figure>
  <figure><img src="assets/weapons/revolver.svg" alt="黄铜转轮与木质握柄"><figcaption>左轮</figcaption></figure>
</section>
<h2>道具</h2>
<section class="items" aria-label="道具插画">
  <figure><img src="assets/items/medkit.svg" alt="红色急救包"><figcaption>急救包</figcaption></figure>
  <figure><img src="assets/items/shield.svg" alt="带金色菱形的绿色盾牌"><figcaption>护盾</figcaption></figure>
  <figure><img src="assets/items/teleport.svg" alt="蓝色光门与石质底座"><figcaption>传送</figcaption></figure>
  <figure><img src="assets/items/radar.svg" alt="绿色雷达屏幕"><figcaption>雷达</figcaption></figure>
  <figure><img src="assets/items/sprint.svg" alt="带绑带的奔跑靴子"><figcaption>疾跑</figcaption></figure>
  <figure><img src="assets/items/ammo.svg" alt="弹药箱与黄铜子弹"><figcaption>弹药</figcaption></figure>
  <figure><img src="assets/items/steal.svg" alt="手套摸走一张卡牌"><figcaption>巧手</figcaption></figure>
  <figure><img src="assets/items/defuse.svg" alt="拆弹钳和红色电线"><figcaption>拆弹钳</figcaption></figure>
</section>
</html>
