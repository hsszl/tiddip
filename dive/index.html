<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141a22">
  <meta name="description" content="兔潜奇境网页复刻：点击上浮，穿过海底管道。">
  <title>兔潜奇境 · tiddip</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://tiddip.com/dive/">
  <link rel="stylesheet" href="style.css">
  <script defer src="game.js"></script>
  <script defer src="render.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="game-layout">
    <header class="navigation">

      <span class="sr-only">最佳 <b id="best">0</b></span>
    </header>
    <div class="watch">
    <div id="stage" class="stage" tabindex="0" aria-label="兔潜奇境：点击、空格或上方向键上浮，P 键暂停">
      <canvas id="canvas" width="212" height="520" aria-label="蓝色潜水兔穿越海底绿色管道"></canvas>
      <output id="score" class="sr-only" aria-live="polite">得分 0</output>
      <button id="pause" class="pause" type="button" aria-label="返回首页">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path class="back-icon" d="m19 8-8 8 8 8"/><g class="more-icon" fill="currentColor" stroke="none"><circle cx="8" cy="16" r="2"/><circle cx="16" cy="16" r="2"/><circle cx="24" cy="16" r="2"/></g></svg>
      </button>

      <section id="overlay" class="overlay" aria-labelledby="title">
        <h1 id="title" class="sr-only">兔潜奇境</h1>
        <p id="result" class="sr-only" hidden></p>
        <p id="message" class="sr-only"></p>
        <button id="action" class="action" type="button" aria-label="开始游戏" disabled>
          <svg viewBox="0 0 32 32" aria-hidden="true"><path class="play-icon" d="m10 6 16 10-16 10Z"/><g class="restart-icon"><path d="M12 5A11 11 0 0 0 8 25m12 2a11 11 0 0 0 4-20"/><path d="m7 5 6-1-1 6m8 12-1 6 6-1"/></g></svg>
        </button>
        <p id="hint" class="sr-only">点击 / 空格上浮</p>
      </section>
      <section id="settings" class="settings" aria-labelledby="settingsTitle" hidden>
        <h2 id="settingsTitle" class="sr-only">兔潜奇境 · 关于与设置</h2>
        <p class="sr-only">原作版本 1.0.5，NEORUAA，无源流沙。</p>
        <button id="hellMode" class="mode-switch" type="button" role="switch" aria-checked="true" aria-label="地狱模式"></button>
      </section>
    </div>
    </div>
    <footer class="options">
      <button id="sound" type="button" aria-pressed="false">声音：关</button>
      <button id="fullscreen" class="fullscreen" type="button" aria-label="进入全屏" title="全屏">⛶</button>
    </footer>
    <noscript>需要开启 JavaScript 才能玩这个游戏。</noscript>
  </main>
</body>
</html>
