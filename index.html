<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4eb">
  <meta name="description" content="一只鹈鹕，一辆自行车。tiddip.com 的第一圈。">
  <title>先骑起来。 — tiddip.com</title>
  <style>
    :root { color-scheme: light; --paper: #f7f4eb; --ink: #283d38; --muted: #747c70; --line: #dcded2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; background: var(--paper); color: var(--ink); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; display: flex; flex-direction: column; }
    header, footer { width: min(1120px, calc(100% - 64px)); margin-inline: auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    header { padding-top: 32px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 750; letter-spacing: -.8px; }
    .brand-dot { width: 13px; height: 13px; border-radius: 50%; background: #df7755; box-shadow: 0 0 0 5px #df775518; }
    .edition { color: var(--muted); font-size: 11px; letter-spacing: 1.8px; }
    main { flex: 1; width: min(1000px, 100%); margin-inline: auto; text-align: center; padding: 52px 20px 28px; }
    .eyebrow { margin: 0 0 17px; color: #7c866d; font-size: 11px; font-weight: 650; letter-spacing: 3px; }
    h1 { margin: 0; font-family: "Songti SC", "SimSun", Georgia, serif; font-size: clamp(38px, 6vw, 64px); font-weight: 700; letter-spacing: 3px; line-height: 1.25; }
    .intro { margin: 18px 0 0; color: var(--muted); font-size: 14px; line-height: 1.8; letter-spacing: .6px; }
    .scene-wrap { position: relative; margin: -10px auto -16px; max-width: 850px; }
    .pelican-scene { display: block; width: 100%; height: auto; overflow: visible; }
    button { appearance: none; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; border: 1px solid #c9cec0; border-radius: 999px; background: transparent; color: var(--ink); font: inherit; font-size: 12px; letter-spacing: 1px; transition: background .18s ease, transform .18s ease; }
    button:hover { background: #e9eddf; transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid #df7755; outline-offset: 5px; }
    .control-icon { min-width: 13px; font-size: 12px; font-weight: 800; }
    footer { border-top: 1px solid var(--line); padding-block: 20px 24px; color: var(--muted); font-size: 11px; letter-spacing: .8px; }
    footer p { margin: 0; }
    @media (max-width: 600px) {
      header, footer { width: calc(100% - 40px); }
      header { padding-top: 24px; }
      .brand { font-size: 19px; }
      .edition { font-size: 9px; letter-spacing: 1px; }
      main { padding: 58px 10px 40px; }
      .intro { padding-inline: 18px; font-size: 12px; }
      .scene-wrap { margin: 22px auto 14px; }
      footer { font-size: 10px; gap: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>

  <footer><p>© 2026 tiddip.com</p><p>慢慢骑，也算前进。</p></footer>
  <script>
    const scene = document.getElementById('pelican');
    const toggle = document.getElementById('motion-toggle');
    const label = document.getElementById('motion-label');
    const icon = toggle.querySelector('.control-icon');
    const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
    let paused = false;

    function setPaused(value) {
      paused = value;
      if (paused) scene.pauseAnimations();
      else scene.unpauseAnimations();
      toggle.setAttribute('aria-pressed', String(paused));
      toggle.setAttribute('aria-label', paused ? '继续动画' : '暂停动画');
      label.textContent = paused ? '继续骑行' : '歇一会儿';
      icon.textContent = paused ? '▶' : 'Ⅱ';
    }

    toggle.addEventListener('click', () => setPaused(!paused));
    motionPreference.addEventListener('change', event => setPaused(event.matches));
    setPaused(motionPreference.matches);
  </script>
</body>
</html>
